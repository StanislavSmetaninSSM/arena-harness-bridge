<!doctype html><meta charset="utf-8"><main></main><output id="out">running</output>
<script src="../core.js"></script><script src="../generated-images.js"></script>
<script src="../native-questions.js"></script><script src="../raw-reply.js"></script><script src="../adapter.js"></script>
<script>
(async () => {
try {
  const page = new ArenaPage(document), main = document.querySelector('main');
  const delivery = 'a'.repeat(32), ticks = String.fromCharCode(96).repeat(3);
  const source = JSON.stringify({$harness:'tool_call',turn_id:delivery,name:'read',arguments:{filePath:'C:\\Users\\fixture.txt'}}, null, 2);
  let clipboardWrites = 0, clicks = 0, currentSource;
  Object.defineProperty(navigator.clipboard,'writeText',{configurable:true,value:async()=>{clipboardWrites++;}});
  function mount(raw, rendered, id = 'fixture') {
    currentSource = raw;
    const row = document.createElement('div');
    row.id = 'chat-message-' + id;
    row.dataset.agentTranscriptMessage = 'true';
    row.dataset.chatMessageId = id;
    row.dataset.messageStatus = 'complete';
    row.innerHTML = '<div class="relative bg-surface-primary rounded-xl border w-full"><div class="px-3 pb-3">'+
      '<div class="flex flex-col gap-2"><div class="prose prose-base body-base">'+rendered+'</div></div>'+
      '<div class="mt-3 flex flex-col gap-3"><div class="flex flex-wrap items-center justify-between gap-2">'+
      '<div class="flex flex-wrap items-center gap-1"><button aria-label="Copy">Copy</button></div></div></div></div></div>';
    row.querySelector('button').onclick=()=>{clicks++;return navigator.clipboard.writeText(currentSource);};
    main.replaceChildren(row);
    return page.rows()[0];
  }
  const block = text => `${ticks}json\n${text}\n${ticks}`;
  const check = (test, label) => { if (!test) throw Error(label); };
  const visuallyBroken='<p>Before</p><p>{"$harness":"tool_call",</p><pre><code>invalid</code></pre><pre><code>fragment</code></pre>';
  mount(block(source),visuallyBroken);
  const message = main.firstElementChild;
  const action = message.querySelector('button');
  const newActions = document.createElement('footer');
  newActions.setAttribute('role','group');
  message.append(newActions);
  newActions.append(action);
  message.querySelector('.prose').insertAdjacentHTML('afterbegin','<button aria-label="Copy">Copy code</button>');
  check(page.captureReplySource(page.rows()[0])===block(source),'native Copy survives changed classes and nesting');
  const duplicateAction=action.cloneNode(true);
  newActions.append(duplicateAction);
  check(page.captureReplySource(page.rows()[0])===undefined,'two visible message actions are ambiguous');
  duplicateAction.hidden=true;
  check(page.captureReplySource(page.rows()[0])===block(source),'a hidden duplicate cannot shadow the visible action');
  message.insertAdjacentHTML('beforeend','<section data-message-content><button aria-label="Copy">Embedded Copy</button></section>');
  check(page.captureReplySource(page.rows()[0])===block(source),'a semantic answer body is not a source of Copy actions');
  message.insertAdjacentHTML('beforeend','<div id="chat-message-other"><button aria-label="Copy">Different reply</button></div>');
  check(page.historyReplySource(page.rows()[0])===block(source),'the Copy action must belong to exactly this reply');
  clicks=0;
  let row = mount('Before\n\n'+block(source)+'\n\nAfter', visuallyBroken);
  check(!row.toolFrame,'the rendered fragment is not a trustworthy command');
  page.recoverToolReply(row, delivery);
  check(row.toolSource === source && row.toolFrame,'the original command must be preserved word for word');
  check(row.responseText === 'Before\n\nAfter','both explanations survive without technical JSON');
  page.recoverToolReply(page.rows()[0], delivery);
  check(clicks===1 && clipboardWrites===0,'one source read must leave clipboard untouched');
  check(page.confirmToolReply(page.rows()[0]), 'the current source matches the pending command');
  currentSource=currentSource.replace('fixture.txt','changed.txt');
  check(!page.confirmToolReply(page.rows()[0]), 'a changed original is rejected even if its rendering stays the same');
  row=mount('Before\n\n'+source+'\n\nAfter',visuallyBroken);
  page.recoverToolReply(row,delivery);
  check(row.toolSource===source,'an intact standalone object is independent of Markdown position');
  const ordinary='{"city":"Vladivostok","count":3}';
  row=mount('Before'+block(source)+'\n\n'+block(ordinary)+'\n\nAfter',visuallyBroken);
  page.recoverToolReply(row,delivery);
  check(row.toolSource===source && row.responseText==='Before\n\n'+block(ordinary)+'\n\nAfter',
    'a fence glued to the preceding prose leaves no empty command block');
  row=mount(block(ordinary),'<pre><code class="language-json">'+ordinary+'</code></pre>');
  page.recoverToolReply(row,delivery);
  check(!row.toolSource && !row.toolFrame && row.text.includes(ordinary),'ordinary JSON stays in the answer');
  row=mount('{\n"example":\n'+source+'\n}',visuallyBroken);
  page.recoverToolReply(row,delivery);
  check(!row.toolFrame && !row.toolSource,'a nested object stays inside ordinary JSON');
  row=mount(source.split('\n').map(line=>'    '+line).join('\n'),visuallyBroken);
  page.recoverToolReply(row,delivery);
  check(!row.toolFrame && !row.toolSource,'a Markdown indented example cannot authorize a call');
  row=mount('<details>\n'+block(source)+'\n</details>', '<details open><pre>'+source+'</pre></details>');
  page.recoverToolReply(row,delivery);
  check(!row.toolFrame && !row.toolSource, 'a details example stays inert');
  row=mount('<!--\n'+block(source)+'\n-->', '<p>The text names "$harness"</p>');
  page.recoverToolReply(row,delivery);
  check(!row.toolFrame && !row.toolSource,'a hidden comment cannot use a visible mention as authority');
  row=mount('<div hidden>\n'+block(source)+'\n</div>', visuallyBroken);
  page.recoverToolReply(row,delivery);
  check(!row.toolFrame && !row.toolSource,'a hidden region cannot borrow a separate visible header');
  row=mount('- Example:\n\n  '+block(source).split('\n').join('\n  '), '<ul><li><pre>'+source+'</pre></li></ul>');
  page.recoverToolReply(row,delivery);
  check(!row.toolFrame && !row.toolSource,'a list-nested example stays inert');
  row=mount(ticks+'json\n'+source,visuallyBroken);
  page.recoverToolReply(row,delivery);
  check(row.toolFrame && row.toolSource===source,'a complete copied JSON object survives an unclosed presentation fence');
  row=mount(block(source)+'\n\n'+block(source),visuallyBroken);
  page.recoverToolReply(row,delivery);
  check(!row.toolFrame && !row.responseText.includes('$harness'),'ambiguous commands stay inert and hidden');
  row=mount('Before'+block(source)+'\n\n'+block(source),visuallyBroken);
  page.recoverToolReply(row,delivery);
  check(!row.toolFrame && !row.responseText.includes('$harness'),
    'a glued command wrapper cannot conceal a second marked block from ambiguity checks');
  const originalMarkdown='Before\n\n'+block(source)+'\n\nAfter';
  row=mount(originalMarkdown,visuallyBroken);
  const wrapper=main.firstElementChild,section=wrapper.querySelector('.prose');
  wrapper.insertAdjacentHTML('beforeend','<span aria-label="Response ended">Done</span>');
  const log=new ArenaBridge.Transcript([]),receipt='Bridge delivery '+delivery;
  const user={role:'user',siteId:'from-operator',text:'Read the fixture\n'+receipt,lastLine:receipt};
  const options={generating:false,captureSource:r=>page.captureReplySource?.(r),historySource:(r,origin)=>page.historyReplySource?.(r,origin)};
  row=page.rows()[0];page.recoverToolReply(row,delivery);
  log.expect(delivery,'Read the fixture',null,receipt);
  const accepted=log.scan([user,row],options).find(e=>e.kind==='assistant');
  check(accepted?.toolSource===source && accepted.text==='Before\n\nAfter','one native command was accepted with sanitized text');
  log.acknowledgeReply(accepted);
  const last=document.createElement('div');last.className=section.className;section.after(last);
  last.append(...Array.from(section.children).slice(1));
  const after=page.rows()[0];
  check(after.text!==row.text && after.multipleFinalBodies && after.complete,'actual two-body redraw changes DOM text for the same ID');
  let now=Date.now();Date.now=()=>now;
  check(log.scan([user,after],options).length===0,'historical redrawing cannot publish another command');
  now+=11000;log.scan([user,page.rows()[0]],options);
  check(!log.fault && log.historyChangedAt==null,'the original Copy source survives the two-body redraw past the history timeout');
  const checkedClicks=clicks;
  for(let i=0;i<7;i++) log.scan([user,page.rows()[0]],options);
  check(clicks===checkedClicks && clipboardWrites===0,'stable historical text does not repeatedly activate Copy');
  const newer=wrapper.cloneNode(true);newer.id='chat-message-next';newer.dataset.chatMessageId='next';main.append(newer);
  check(page.historyReplySource(page.rows()[0])===originalMarkdown,'an older completed native row has its own historical Copy proof');
  check(!page.confirmToolReply(page.rows()[0]),'a historical row cannot regain current command authority');
  const duplicate=wrapper.cloneNode(true);main.append(duplicate);
  check(page.historyReplySource(page.rows()[0])===undefined,'a duplicate identity cannot supply historical proof');
  duplicate.remove();newer.remove();
  currentSource=originalMarkdown.replace('fixture.txt','different.txt');
  log.scan([user,page.rows()[0]],{...options,outgoing:true});
  check(/source/i.test(log.fault),'actual Send guard detects changed arguments with identical visible rendering');
  const link=JSON.stringify({$harness:'tool_call',turn_id:delivery,name:'pwsh',arguments:{command:{$text:'script'}}});
  const script='  $p = "D:\\Games\\Arena"\r\n\r\n[Console]::WriteLine($p)  ';
  row=mount('Before\n\n'+block(link)+'\n\n'+ticks+'harness-text script\r\n'+script+'\r\n'+ticks+'\n\nAfter',visuallyBroken);
  page.recoverToolReply(row,delivery);
  check(row.toolSource==='\x1e'+link+'\x1escript\n'+script && row.responseText==='Before\n\nAfter',
    'the same confirmed source retains the separate text bytes outside the display text');
  check(page.confirmToolReply(page.rows()[0]),'the whole source is verified before handing off the argument');
  currentSource=currentSource.replace('WriteLine','Write');
  check(!page.confirmToolReply(page.rows()[0]),'changing only the separate text invalidates the tool proof');
  const fenced=ticks+'harness-text script\nWrite-Output denied\n'+ticks;
  for(const ambiguous of [
    fenced+'\n\n'+fenced, '    '+fenced, '<table>\n'+fenced+'\n</table>', '<!--\n'+fenced+'\n-->',
    fenced+'\u2003', ticks+'`text\n'+fenced+'\n'+ticks+'`', '<![CDATA[\n'+fenced+'\n]]>',
    '<table data-test="/>">\n'+fenced+'\n</table>', '<table/>\n'+fenced,
    'ordinary\u2028'+fenced, fenced.replace('\n'+ticks,'\u2029'+ticks),
    '<table\n>\n'+fenced+'\n</table>', ticks+'text`tail\n'+ticks+'\n'+fenced+'\n'+ticks,
    ['- item','   '+ticks,ticks,fenced].join('\n'),
  ]){
    row=mount(block(link)+'\n\n'+ambiguous,visuallyBroken);
    page.recoverToolReply(row,delivery);
    check(row.toolSource===link,'a nested, unclosed, or ambiguous block cannot accompany a tool command');
  }
  const overlap=[ticks+'ordinary'+ticks[0],ticks,ticks+'json',link,ticks,ticks,fenced].join('\n');
  row=mount(overlap,visuallyBroken);
  page.recoverToolReply(row,delivery);
  check(row.toolSource===link,'the JSON span cannot suppress a surrounding ordinary fence');
  const crBody='\r  Write-Output "D:\\Temp"  ';
  row=mount(block(link)+'\n\n'+ticks+'harness-text script\r'+crBody+'\r'+ticks,visuallyBroken);
  page.recoverToolReply(row,delivery);
  check(row.toolSource==='\x1e'+link+'\x1escript\n'+crBody,'CR-only delimiters keep the exact body');
  const invalidFrame = link+'\x1escript\nWrite-Output ignored';
  row=mount(block(invalidFrame),visuallyBroken);
  page.recoverToolReply(row,delivery);
  check(row.toolSource===invalidFrame && !row.toolSource.startsWith('\x1e'),'copied malformed JSON cannot mint the transport prefix');
  const streamMarkdown = '## Stream fixture\n\nSecond part \u{1F9EA}';
  row=mount(streamMarkdown,'<p>Fixed visible reply</p>');
  await (await fetch('/api/chat/fixture/events')).text();
  await new Promise(resolve=>setTimeout(resolve,50));
  currentSource += '\nExtra blank space in the Copy version';
  const clicksBeforeStream = clicks;
  check(page.captureReplySource(row)===streamMarkdown && clicks===clicksBeforeStream,
    'stream selection skips Copy even when its text would differ');
  check(page.historyReplySource(row,'copy')===currentSource,'a Copy snapshot can be checked using Copy');
  check(page.historyReplySource(row,'stream')===streamMarkdown,'a streamed snapshot uses the stream');
  check(clipboardWrites===0,'source selection leaves the clipboard untouched');
  const controlled = JSON.stringify({$harness:'tool_call',turn_id:delivery,name:'read',arguments:{filePath:'fixture.txt'}});
  const toolMarkdown = 'Before\n\n'+block(controlled)+'\n\nAfter';
  const fallback = '[Report](https://example.test/report)';
  row=mount(fallback,'<p><a href="https://example.test/report">Report</a></p>','copy-fallback');
  page.recoverToolReply(row,delivery);
  check(row.responseText===fallback && !row.toolFrame,'ordinary Copy fallback retains its exact Markdown');
  async function withStream(scenario) {
    await (await fetch('/api/chat/fixture/events?case='+scenario)).text();
    // Chrome consumes the original body and the observer's branch independently.
    await new Promise(resolve=>setTimeout(resolve,50));
    return mount(toolMarkdown,visuallyBroken,scenario);
  }
  row = await withStream('stream-only');
  main.firstElementChild.querySelector('button').remove();
  const hiddenPrior = main.firstElementChild.cloneNode(true);
  hiddenPrior.id = 'chat-message-hidden-prior';
  hiddenPrior.dataset.chatMessageId = 'hidden-prior';
  hiddenPrior.hidden = true;
  main.append(hiddenPrior);
  page.recoverToolReply(row,delivery);
  check(row.toolSource===controlled && row.responseText==='Before\n\nAfter',
    'the complete stream is available with a hidden previous-chat reply after the visible one');
  check(page.confirmToolReply(page.rows()[0]),'the stream alone can confirm the same source before publication');
  check(page.captureReplySource(page.rows()[0])===toolMarkdown,'the exact streamed Markdown is recorded for the history check');
  const sameTick = new ArenaBridge.Transcript([]);
  sameTick.expect(delivery,'Read the fixture',null,receipt);
  const combined = sameTick.scan([user,row],{...options,recoverReply:(row,id)=>page.recoverToolReply(row,id)});
  check(combined.length===2 && combined[1].toolSource===controlled,'an echo and reply arriving together still require the exact source');
  check(sameTick.scan([user,page.rows()[0]],options).length===0,'the same native reply cannot publish its tool again');
  const markerParagraph = main.firstElementChild.querySelectorAll('.prose p')[1];
  markerParagraph.style.visibility='hidden';
  const obscured = page.rows()[0];
  check(obscured.text===row.text && !obscured.visibleToolMarker,'only visibility of the mandatory marker changed');
  check(!page.confirmToolReply(obscured),'a cached frame cannot replace a currently visible native marker');
  markerParagraph.style.visibility='';
  hiddenPrior.remove();

  row = await withStream('no-op-copy');
  main.firstElementChild.querySelector('button').onclick=()=>{};
  page.recoverToolReply(row,delivery);
  check(row.toolSource===controlled && page.confirmToolReply(page.rows()[0]),
    'a visible Copy action without an immediate write cannot block an independently complete stream');

  row = await withStream('conflict');
  currentSource = 'Before\n\n' + toolMarkdown.slice('Before'.length);
  page.recoverToolReply(row,delivery);
  check(row.toolSource===controlled && row.responseText==='Before\n\nAfter',
    'extra Copy line breaks cannot reject the exact streamed tool');
  const pinnedLog = new ArenaBridge.Transcript([user]);
  pinnedLog.waiting=true;
  pinnedLog.replyTo=pinnedLog.commandDelivery=delivery;
  const [queuedCommand] = pinnedLog.scan([user,row],options);
  const beforeRedraw = page.rows()[0];
  check(page.confirmToolReply(beforeRedraw),'stream can publish when Copy has extra newlines');
  row=mount(currentSource,visuallyBroken+'<p>Redrawn</p>','conflict');
  check(pinnedLog.scan([user,row],options).length===0 && !pinnedLog.historyChangedAt && !pinnedLog.fault,
    'redraw before acknowledgement preserves the pending stream command');
  check(pinnedLog.currentCommand(queuedCommand,[user,row]) &&
    page.confirmToolReply(row,pinnedLog.replyRows.get(queuedCommand)),
    'replacing the DOM node before publication preserves the pinned command');
  pinnedLog.acknowledgeReply(queuedCommand);
  check(pinnedLog.scan([user,row],{...options,outgoing:true}).length===0 && !pinnedLog.fault,
    'outgoing delivery after acknowledgement checks the pinned source');
  const nextUserTurn={role:'user',siteId:'followup',text:'Continue'};
  const nextReply={role:'assistant',siteId:'done',complete:true,text:'Final answer'};
  const followup=pinnedLog.scan([user,row,nextUserTurn,nextReply],options);
  check(followup.at(-1)?.text==='Final answer' && !followup.some(event=>event.toolFrame),
    'next turn delivers one final without replay');

  const beforeAcceptance = new ArenaBridge.Transcript([user]);
  beforeAcceptance.waiting=true;
  beforeAcceptance.replyTo=beforeAcceptance.commandDelivery=delivery;
  const renderCommand = '<pre><code class="language-json">'+controlled+'</code></pre>';
  row=mount(toolMarkdown,renderCommand,'conflict');
  const collectFinal={...options,recoverReply:(r,id)=>page.recoverToolReply(r,id)};
  beforeAcceptance.scan([user,row],{...collectFinal,publishNativeFinal:false});
  check(beforeAcceptance.pendingNativeCommand,'fixture must first observe a pending rendered command');
  row=mount(toolMarkdown,'<p>Reflowed</p>'+renderCommand,'conflict');
  const newlyAccepted=beforeAcceptance.scan([user,row],collectFinal);
  check(newlyAccepted[0]?.toolSource===controlled && !beforeAcceptance.fault,
    'a redraw before first source selection waits for the completed source');

  row=mount(streamMarkdown,'<p>Ordinary reply</p>','fixture');
  const ordinaryLog=new ArenaBridge.Transcript([user]);
  ordinaryLog.waiting=true;
  ordinaryLog.replyTo=ordinaryLog.commandDelivery=delivery;
  const [ordinaryReply]=ordinaryLog.scan([user,row],collectFinal);
  row=mount('Different Copy presentation','<p>Ordinary</p><p>reply</p>','fixture');
  ordinaryLog.scan([user,row],options);
  check(ordinaryReply.text===streamMarkdown && !ordinaryLog.fault && !ordinaryLog.historyChangedAt,
    'a plain reply can redraw before its HTTP acknowledgement');
  ordinaryLog.acknowledgeReply(ordinaryReply);
  row=await withStream('history-replay');
  const replayLog=new ArenaBridge.Transcript([user]);
  replayLog.waiting=true;
  replayLog.commandDelivery=replayLog.replyTo=delivery;
  const [replayCommand]=replayLog.scan([user,row],collectFinal);
  check(replayCommand.toolSource===controlled,'initial stream command was queued');
  await (await fetch('/api/chat/fixture/events?case=history-replay&edited=1')).text();
  await new Promise(resolve=>setTimeout(resolve,50));
  check(!page.confirmToolReply(page.rows()[0],replayLog.replyRows.get(replayCommand)),
    'conflicting replay within the selected stream blocks publication');
  replayLog.acknowledgeReply(replayCommand);
  replayLog.scan([user,page.rows()[0]],{...options,outgoing:true});
  check(replayLog.transcriptChanged,'history detects a changed replay from the selected stream');

  row=await withStream('evicted');
  const archive=new ArenaBridge.Transcript([user]);
  archive.waiting=true;
  archive.commandDelivery=archive.replyTo=delivery;
  const [archived]=archive.scan([user,row],collectFinal);
  for(let n=0;n<8;n++) await (await fetch('/api/chat/fixture/events?case=other-'+n)).text();
  await new Promise(resolve=>setTimeout(resolve,50));
  row=mount('Copy differs after cache eviction',visuallyBroken+'<p>New layout</p>','evicted');
  check(page.historyReplySource(row,'stream')?.status==='unobserved','the stream was actually evicted');
  check(page.confirmToolReply(row,archive.replyRows.get(archived)),'queued source survives stream cache eviction');
  archive.acknowledgeReply(archived);
  archive.scan([user,row],{...options,outgoing:true});
  check(!archive.fault && !archive.historyChangedAt,'cache eviction preserves the accepted native reply');

  row=await withStream('late-finish');
  const lateLog=new ArenaBridge.Transcript([user]);
  lateLog.waiting=true;
  lateLog.commandDelivery=lateLog.replyTo=delivery;
  check(lateLog.scan([user,row],collectFinal).length===0 && lateLog.waiting,
    'a missing finish gets a chance to arrive before settling the turn');
  await (await fetch('/api/chat/fixture/events?case=late-finish&recovered=1')).text();
  await new Promise(resolve=>setTimeout(resolve,50));
  row=page.rows()[0];
  const [recoveredAnswer]=lateLog.scan([user,row],collectFinal);
  check(recoveredAnswer?.toolSource===controlled,'a full replay settles a waiting command without another request');
  row = await withStream('interrupted');
  page.recoverToolReply(row,delivery);
  check(!row.toolFrame && !row.toolSource && /incomplete/i.test(row.responseText),
    'a stream without finish cannot borrow authority from a visible command or Copy');
  const interrupted = main.firstElementChild;
  const interruptedLog = new ArenaBridge.Transcript([user]);
  interruptedLog.waiting=true;
  interruptedLog.replyTo=interruptedLog.commandDelivery=delivery;
  check(interruptedLog.scan([user,row],options).length===0,'incomplete reply initially waits');
  now+=8000;
  interruptedLog.scan([user,page.rows()[0]],{...options,publishNativeFinal:false});
  now+=2001;
  const rejected=interruptedLog.scan([user,row],options);
  check(rejected.length===1 && !rejected[0].toolFrame && /incomplete/i.test(rejected[0].text),
    'the incomplete turn settles as an ordinary error without a command');
  interruptedLog.acknowledgeReply(rejected[0]);
  const generic = mount(toolMarkdown,visuallyBroken,'interrupted');
  const nativeNode = main.firstElementChild, genericProse = document.createElement('div');
  nativeNode.dataset.messageAuthorRole='assistant';
  genericProse.className='prose';
  genericProse.innerHTML='<pre><code class="language-json"></code></pre>';
  genericProse.querySelector('code').textContent=controlled;
  nativeNode.replaceChildren(genericProse);
  const genericRow = page.rows()[0];
  check(!generic.toolFrame && genericRow.toolFrame,'the alternate layout exposes a rendered native tool frame');
  page.recoverToolReply(genericRow,delivery);
  check(!genericRow.toolFrame && /incomplete/i.test(genericRow.responseText),
    'a different layout still cannot substitute rendered JSON for an incomplete stream');
  const nextUser={role:'user',siteId:'next-user',text:'Continue normally'};
  const nextRow=mount('A later normal reply','<p>A later normal reply</p>','next-reply');
  main.prepend(interrupted);
  const next=interruptedLog.scan([user,page.rows()[0],nextUser,nextRow],options);
  check(next.some(event=>event.kind==='assistant' && event.text==='A later normal reply') && !next.some(event=>event.toolFrame),
    'the next turn is returned normally and cannot replay the incomplete command');
  const sent = ArenaBridge.delivery('Result\n\tstep()',delivery);
  const submitted = document.createElement('div');
  submitted.id = 'chat-message-submitted';
  submitted.dataset.agentTranscriptMessage = 'true';
  submitted.dataset.chatMessageId = 'submitted';
  submitted.dataset.messageAuthorRole = 'user';
  submitted.innerHTML = '<div class="prose"><p>Result</p><pre><code></code></pre><p></p></div><button aria-label="Copy">Copy</button>';
  submitted.querySelector('code').textContent = '\tstep()';
  submitted.querySelector('.prose p:last-child').textContent = sent.receipt;
  main.replaceChildren(submitted);
  let legacyWrites = 0;
  let submittedSource = sent.text;
  Object.defineProperty(document,'execCommand',{configurable:true,value:()=>{legacyWrites++;return true;}});
  submitted.querySelector('button').onclick = () => {
    const shadow = document.createElement('span');
    shadow.style.whiteSpace='pre';
    shadow.textContent = submittedSource;
    document.body.append(shadow);
    const range = document.createRange();
    range.selectNodeContents(shadow);
    const selection = document.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    try { document.execCommand('copy'); }
    finally { selection.removeAllRanges(); shadow.remove(); }
  };
  check(page.historyReplySource(page.rows()[0])===sent.text,'whole native legacy copy source is read without normalization');
  submitted.querySelector('code').textContent = 'step()\t';
  check(page.historyReplySource(page.rows()[0])===sent.text,'visual code redraw preserves the authored legacy copy source');
  submittedSource=submittedSource.replace('\tstep()', '\t\tstep()');
  check(page.historyReplySource(page.rows()[0])===submittedSource && legacyWrites===0,
    'an original code indentation edit is observable without writing to the clipboard');
  let clipboardItemWrites = 0;
  Object.defineProperty(navigator.clipboard,'write',{configurable:true,value:async()=>{clipboardItemWrites++;}});
  submitted.querySelector('button').onclick=()=>navigator.clipboard.write([]);
  check(page.historyReplySource(page.rows()[0])===undefined && clipboardItemWrites===0,
    'an unsupported user Copy transport cannot overwrite the system clipboard');
  document.querySelector('#out').textContent='All fixture checks passed';
} catch(error){document.querySelector('#out').textContent=error.message;}
})();
</script>
